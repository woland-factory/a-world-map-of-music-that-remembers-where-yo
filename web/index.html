<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
    />
    <title>A world map of music</title>
    <meta
      name="description"
      content="A map of every music genre. The places you explore light up."
    />
    <!-- Runtime config. In the container the entrypoint regenerates this
         from environment variables before nginx starts. -->
    <script src="/env.js"></script>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="app">
      <canvas
        id="map"
        role="img"
        aria-label="A map of music genres. Loading."
      ></canvas>

      <!-- Skeleton: holds the layout steady while the atlas loads. -->
      <div id="skeleton" class="overlay" aria-hidden="false">
        <div class="skeleton-field"></div>
        <p class="skeleton-caption">Charting the atlas of music.</p>
      </div>

      <!-- Error: shown only if the atlas fails to load. -->
      <div id="error" class="overlay" hidden>
        <div class="card">
          <h1>Let's try that again</h1>
          <p>Check your connection and reload the map.</p>
          <button id="reload" type="button" class="primary">Reload</button>
        </div>
      </div>

      <!-- First-run orientation: shown once, then never again. -->
      <div id="orientation" class="orientation" hidden>
        <div class="card">
          <p class="lead">A map of every music genre. The places you explore light up.</p>
          <p class="hint">Tap a genre to hear it. Stamp the ones you love.</p>
          <button id="got-it" type="button" class="primary">Got it</button>
        </div>
      </div>

      <!-- Map controls. -->
      <div id="controls" class="controls" hidden>
        <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
        <button id="zoom-out" type="button" aria-label="Zoom out">&minus;</button>
        <button id="reset-view" type="button" aria-label="Reset view">
          <span aria-hidden="true">&#9678;</span>
        </button>
      </div>

      <!-- Region legend (accessible DOM, not canvas-only). -->
      <aside id="legend" class="legend" hidden>
        <button id="legend-toggle" type="button" aria-expanded="true" aria-controls="legend-list">
          Regions
        </button>
        <ul id="legend-list"></ul>
      </aside>

      <!-- Passport button (top-right), shows the lit count as a badge. -->
      <button id="passport-btn" class="passport-btn" type="button" aria-label="Passport" aria-haspopup="dialog" hidden>
        <span class="pb-label">Passport</span>
        <span id="passport-count" class="pb-badge">0</span>
      </button>

      <!-- Daily dare: one new sound a day from the edge of your territory.
           Collapsible to a small pill so it never blocks the map. Its inner
           text is built in TS and set with textContent. -->
      <section id="dare" class="dare-card" aria-label="Today's dare" hidden>
        <button id="dare-pill" class="dare-pill" type="button" aria-label="Show dare" hidden>
          Today's dare
        </button>
        <div id="dare-panel" class="dare-panel">
          <button id="dare-collapse" class="dare-collapse" type="button" aria-label="Hide dare">
            <span aria-hidden="true">&times;</span>
          </button>
          <div id="dare-content" aria-live="polite"></div>
        </div>
      </section>

      <!-- Now-playing panel: the selected genre, its track, and Stamp. -->
      <section id="now-playing" class="now-playing" aria-live="polite" hidden>
        <button id="np-close" class="sheet-close" type="button" aria-label="Close">&times;</button>
        <h2 id="np-title" class="np-title"></h2>
        <p id="np-track" class="np-track"></p>
        <div class="np-actions">
          <button id="np-stamp" class="primary" type="button">Stamp</button>
          <span id="np-stamped" class="np-stamped" role="status" hidden></span>
          <button id="np-remove" class="ghost" type="button" hidden>Remove stamp</button>
        </div>
      </section>

      <!-- Passport sheet: the stamps you kept. -->
      <div id="passport" class="passport-sheet" role="dialog" aria-modal="true" aria-labelledby="passport-heading" hidden>
        <div class="ps-inner">
          <header class="ps-header">
            <h2 id="passport-heading">Passport</h2>
            <button id="passport-close" class="sheet-close" type="button" aria-label="Close">&times;</button>
          </header>
          <p id="passport-countline" class="ps-count"></p>
          <div id="passport-empty" class="ps-empty" hidden>
            <h3>Your map is dark</h3>
            <p>Tap a genre to hear it. Stamp the ones you love.</p>
          </div>
          <ul id="passport-list" class="ps-list"></ul>
          <p id="passport-msg" class="ps-msg" role="status" hidden></p>
          <div class="ps-actions">
            <button id="passport-export" type="button">Export</button>
            <button id="passport-import" type="button">Import</button>
            <button id="passport-see" class="primary" type="button">See your map</button>
          </div>
          <input id="passport-file" type="file" accept="application/json" hidden />
          <a id="passport-download" aria-hidden="true" hidden></a>
        </div>
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
