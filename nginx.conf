server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 512;

  # The atlas data is regenerated offline; allow it to be revalidated.
  location /data/ {
    add_header Cache-Control "public, max-age=300";
  }

  # Runtime config must never be cached; the entrypoint rewrites it per boot.
  location = /env.js {
    add_header Cache-Control "no-store";
  }

  # Hashed build assets are immutable.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The ListenBrainz proxy. The variable form makes nginx resolve the name
  # at request time, so the map still serves when the api container is down
  # (the client copy covers the resulting 502).
  location /api/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_upstream api;
    proxy_pass http://$api_upstream:8081;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 15s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
